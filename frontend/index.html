<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Research Opportunity Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Research Opportunity Portal</h1>
    <p>Browse and manage university research opportunities</p>
</header>

<main>

    <section id="message-box" class="message hidden"></section>

    <section class="panel">
        <h2>Post a New Research Opportunity</h2>
        <form id="create-form">
            <div class="form-row">
                <label for="title">Research Title *</label>
                <input type="text" id="title" required>
            </div>

            <div class="form-row">
                <label for="description">Description *</label>
                <textarea id="description" rows="3" required></textarea>
            </div>

            <div class="form-row two-col">
                <div>
                    <label for="research_area">Research Area *</label>
                    <input type="text" id="research_area" required>
                </div>
                <div>
                    <label for="faculty_name">Faculty Name *</label>
                    <input type="text" id="faculty_name" required>
                </div>
            </div>

            <div class="form-row two-col">
                <div>
                    <label for="department">Department *</label>
                    <input type="text" id="department" required>
                </div>
                <div>
                    <label for="required_skills">Required Skills *</label>
                    <input type="text" id="required_skills" placeholder="e.g. Python, TensorFlow" required>
                </div>
            </div>

            <div class="form-row two-col">
                <div>
                    <label for="positions_available">Available Positions *</label>
                    <input type="number" id="positions_available" min="1" required>
                </div>
                <div>
                    <label for="application_deadline">Application Deadline *</label>
                    <input type="date" id="application_deadline" required>
                </div>
            </div>

            <button type="submit">Post Opportunity</button>
        </form>
    </section>

    <section class="panel">
        <h2>Available Opportunities</h2>
        <div id="opportunity-list" class="card-grid">
            <p>Loading opportunities...</p>
        </div>
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
